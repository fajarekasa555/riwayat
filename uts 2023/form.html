<!DOCTYPE html>

        </div>

                </div>
            </div>
        </div>
        <div class="kontainer">
            <div class="ttl">
                <div class="nomor"><h1>2</h1></div>

            </div>
        </div>
        <div class="kontainer">
            <div class="form">
                <div class="formdlm">
                    <div class="input">
                        <label for="email">email </label>

                        <label for="phone">phone number</label>

                </div>
            </div>
        </div>
        <div class="kontainer">

        </div>
        <div class="kontainer">
            <div class="form">
                <div class="formdlm">
                    <div class="input">
                        <label for="password">password</label>
                        <input id="password" type="text" class="inpt">
                        <label for="confirm">confirm</label>
                        <input id="confirm" type="text" class="inpt">
                        
                    </div>
                </div>
            </div>
            
        </div>
        <div class="kontainer">
            <div class="form3">
                <div class="formdlm2">
                    <button class="btn" type="submit">Submit</button>
                </div>
            </div>
        </div>
