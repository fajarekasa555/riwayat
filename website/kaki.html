<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salib Kristen</title>
<link rel="stylesheet" href="styles.css">
</head>
<style>
    body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #f0f0f0;
}

.cross {
  width: 100px;
  height: 150px;
  position: relative;
}

.vertical,
.horizontal {
  background-color: #8c1717;
  position: absolute;
}

.vertical {
  width: 10px;
  height: 100%;
  left: 45px;
}

.horizontal {
  width: 100%;
  height: 10px;
  top: 50px;
}

</style>
<body>
  <div class="cross">
    <div class="vertical"></div>
    <div class="horizontal"></div>
  </div>
</body>
</html>
