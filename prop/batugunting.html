            <script>
                var bgm = new Audio();
                bgm.src = "musik/bgm6.mp3";
                bgm.loop = true;
                bgm.play() ;
        
                function mulai() {
                    var play = document.getElementById("play") ;
                    var mute = document.getElementById("mute") ;
                    var prev = document.getElementById("prev") ;
                    var unvious = document.getElementById("unvious");
        
                    play.addEventListener('click', fplay);
                    mute.addEventListener('click', fmute);   
                    prev.addEventListener('click', fprev);     
                    unvious.addEventListener('click', funvious)
        
                    function fplay(){
                        if(bgm.paused){
                            bgm.play();
                            play.style.background="url(foto/2pause.png)";
                        }else{
                            bgm.pause() ;
                            play.style.background="url(foto/2play.png)";
                        }
                    }
                    function fmute(){
                        if(bgm.muted){
                            bgm.muted = false;
                            mute.style.background="url(foto/2unmute.png)";
                        }else{
                            bgm.muted= true;
                            mute.style.background="url(foto/2mute.png)";
                        }
                    }
                    function fprev(){
                        if(prev.click){
                            bgm.src = "musik/bgm3.mp3";
                            bgm.play();         
                        }       
                    }
                    function funvious(){
                        if(unvious.click){
                            bgm.src = "musik/bgm2.mp3";
                            bgm.play();
                        }                
                    }
        
                }
                window.addEventListener('load', mulai) ;
        
            </script>
    <script>
        class Start{
            constructor(){
                this.namapemain = "kamu"
                this.botname = "Candra"
                this.pilihanpemain;
                this.pilihanbot;
                this.pemenang;
            }

            get getpilihanbot(){
                return this.pilihanbot;
            }

            set setpilihanbot(pilihan){
                this.pilihanbot = pilihan;
            }

            set Pilihanpemain(pilihan) {
                this.Pilihanpemain = pilihan;
            }
            mainbot(){
                const pilihan = ["👊","🖐","✌"];
                const bot = pilihan[Math.floor(Math.random() * pilihan.length)];
                return bot;
                
            }
            kemenangan(){
                if(this.pilihanbot == "🖐" && this.pilihanpemain == "✌") {
                    return this.pemenang = this.namapemain
                } else if (this.pilihanbot == "🖐" && this.pilihanpemain == "👊") {
                    return this.pemenang = this.botname
                } else if (this.pilihanbot == "✌" && this.pilihanpemain == "🖐") {
                    return this.pemenang = this.botname
                } else if (this.pilihanbot == "✌" && this.pilihanpemain == "👊") {
                    return this.pemenang = this.namapemain
                } else if (this.pilihanbot == "👊" && this.pilihanpemain == "🖐") {
                    return this.pemenang = this.namapemain
                } else if (this.pilihanbot == "👊" && this.pilihanpemain == "✌") {
                    return this.pemenang = this.botname
                } else {
                    return this.pemenang = "SERI"
                }
            }
            tanggapan(){
                if(this.pemenang != "SERI"){
                    return  (this.pemenang+" MENANG");
                }else{
                    return  ("HAHA "+this.pemenang+" TIDAK ADA YANG MENANG");
                }
            }
        }
        function dipilih(pilihanmu) {
            const start = new Start();
            start.pilihanpemain = pilihanmu
            console.log("Kamu memilih : ",pilihanmu);
            start.setpilihanbot = start.mainbot();
            console.log("bot memilih : ",start.pilihanbot)
            start.kemenangan();
            console.log("Pemenang : ",start.pemenang);
            console.log(start.tanggapan());

            const dalamgame = document.getElementById("dalamgame");
            dalamgame.textContent = ("KAMU "+pilihanmu+" VS "+start.pilihanbot+" CANDRA");
            hasil.textContent = start.tanggapan();
        }
    </script>
